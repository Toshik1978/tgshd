version: "3"

vars:
  BINARY: bin/tgshd
  # Coverage gate scope: the cleanly unit-testable logic packages. The I/O
  # adapters (ping, power, speedtest, telegram transport, zte device client),
  # the gammu Postgres repository, and the fx root (cmd/main.go) run only
  # against real hardware/services and are exercised in integration, not here.
  COVERPKG: ./pkg/command/...,./pkg/sms,./pkg/script,./cmd/app
  BUILDSTAMP:
    sh: date +%Y/%m/%d_%H:%M:%S
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown

tasks:
  setup:
    desc: Download Go module dependencies
    cmd: go mod download

  lint:
    desc: Run golangci-lint
    cmd: golangci-lint run

  format:
    desc: Format the codebase
    cmds:
      - golangci-lint fmt
      - golangci-lint run --fix

  test:
    desc: Run unit tests
    cmd: go test -v ./...

  test:coverage:
    desc: Run all unit tests with the race detector and coverage over the gate scope
    cmd: >-
      go test -race
      -coverpkg={{.COVERPKG}}
      -coverprofile=coverage.txt -covermode=atomic ./...

  build:
    desc: Compile the tgshd binary
    cmds:
      - rm -f {{.BINARY}}
      - >-
        GOGC=off go build -v
        -ldflags "-X main.Buildstamp={{.BUILDSTAMP}} -X main.Commit={{.COMMIT}}"
        -o {{.BINARY}} cmd/main.go
    generates:
      - "{{.BINARY}}"

  clean:
    desc: Remove build artifacts and test cache
    cmds:
      - go clean -testcache
      - rm -f {{.BINARY}} coverage.txt
