# Example host health configuration for tgshd (see README.md, "Host health
# monitoring"). Point BOT_HEALTH_CONFIG at a copy of this file to enable it.
#
# Strict YAML: unknown keys are errors. An invalid entry is reported as a
# checker error and skipped; a file that cannot be parsed disables health
# monitoring. All top-level sections are optional: an omitted section takes
# its defaults, and a check type that is absent is not run.
#
# Durations use Go syntax (30s, 15m, 6h) plus d for days (8d).
# Per-check common keys: interval, threshold, mode (tlg | sms | tlg-or-sms,
# default tlg), needs_internet (default false), summary_group (default none:
# one weekly-summary line per check; checks naming the same group, [a-z0-9-]+,
# share one line; no effect on disks, temperatures and kernel, which the
# summary's services block leaves out) and pause_in_quiet_windows (default
# false for disks, temperatures and kernel, which keep running through quiet
# windows; true for every other check). modem_probe takes neither
# summary_group nor pause_in_quiet_windows. Set pause_in_quiet_windows: true
# on disks, temperatures or kernel to pause them too. WARNING: a command check with a fix keeps
# running its probe and its fix through a quiet window when you set it to
# false, so leave it true unless the fix is safe at any hour.

general:
  state_dir: /var/lib/tgshd                 # state database and instance lock
  heartbeat_file: /run/tgshd/heartbeat      # written every 30 s for an external watchdog
  maintenance_lock: /run/maintenance.lock   # optional; absent => no maintenance windows
  boot_grace: 10m
  concurrency: 4
  maintenance_max_hold: 6h                  # a lock held longer raises a checker error; the window stays
  telegram_failing_after: 15m               # Telegram failing this long sends one email notice (SMS fallback starts at once)

# Weekly report; omit the section to disable it.
summary:
  weekday: monday
  time: "09:00"                             # host local time

# Evaluated first every cycle.
network:
  interval: 5m
  threshold: 5m                             # default: one interval; 0 alerts on the first bad cycle
  internet_targets: [ "203.0.113.10", "198.51.100.20" ]   # any one answering => internet up
  mode: sms                                 # PROBLEM by SMS; RESOLVED by tlg-or-sms (fixed)
  pause_in_quiet_windows: true              # default true here

# Uses the BOT_NUT_* connection settings.
ups:
  interval: 5m
  threshold: 5m

disks:
  interval: 15m
  wear_percent: 80                          # NVMe percentage used / SSD wear above => PROBLEM
  selftest_max_age: 40d                     # calendar time since a passed self-test was last seen
  pause_in_quiet_windows: false             # default false: keeps running through quiet windows
  spare_floor_percent: 20                   # spare capacity floor, percent
  force_read_after: 24h                     # longest a sleeping drive goes unread before it is woken
  include_serials: []                       # USB or other-transport drives to watch
  extra_counters: []                        # extra ATA attribute ids (1-255)
  extra_counters_by_serial: {}              # serial -> attribute ids, e.g. { TEST0000000001: [230] }
  exclude_serials: []                       # e.g. [ "TEST0000000002" ]

# WARNING: on a VM without CPU hwmon sensors this check raises temps/cpu/none
# on every cycle. Disable it there by removing the whole section.
temperatures:
  interval: 15m
  threshold: 0                              # the first reading at or above a limit opens a problem
  pause_in_quiet_windows: false             # default false: keeps running through quiet windows
  limits:                                   # degrees Celsius, PROBLEM at or above
    cpu: 90                                 # one package sensor per CPU
    drive_nvme: 60                          # judged by the disks check from SMART
    drive_sata: 60                          # SATA and SAS, judged by the disks check
    gpu: 85
    board: 75                               # default for board_sensors entries
  limits_by_serial: {}                      # drive serial -> limit (0-150), overrides the class limit
  board_sensors: []                         # board sensors to judge; chip required, label optional
  # board_sensors:                          # "*" globs work in chip and label
  #   - {chip: "nct*", label: "SYSTIN", limit: 75}   # limit defaults to limits.board

kernel:
  interval: 15m                             # EDAC counters; kmsg is read continuously
  pause_in_quiet_windows: false             # default false: keeps running through quiet windows

memory:                                     # absent => no memory check and no guard; every value shown is the default
  interval: 1m
  threshold: 5m
  mode: tlg                                 # warnings, and guard reports of a problem it fixed
  pause_in_quiet_windows: true              # warnings only; the guard never pauses
  warn_available_percent: 15                # 1-99: PROBLEM when MemAvailable stays below this
  warn_swap_percent: 80                     # 1-100; ignored on hosts without swap
  warn_pressure_percent: 10                 # 1-100: PSI "some" avg60, share of time tasks waited for memory
  growth_window: 1h                         # 10m-24h: a service growing by growth_warn within it is a PROBLEM
  growth_warn: 4GB                          # B, KB, MB, GB, TB (powers of 1024)
  audit_exclude: [ "scratch-job" ]          # containers allowed to run without a memory limit
  guard:                                    # the fast guard: runs on its own, not on the check interval
    intervene: report                       # off | report | act. Start in report, check the "would restart"
                                            # messages name the right service, then switch to act
    never_touch: [ "db", "backup.service" ] # container names or systemd unit names the guard never stops or restarts
    danger_available_percent: 5             # 1-50, must be below warn_available_percent
    danger_pressure_percent: 20             # 1-100: PSI "full" avg10, share of time every task waited
    danger_for: 30s                         # 5s-5m: both danger conditions must hold this long
    culprit_window: 10m                     # 1m-1h: window in which a service's growth is measured
    culprit_min_growth: 1GB                 # a service must have grown by this much to be blamed
    repeat_window: 6h                       # 0 disables the stop rule (always restart); else a repeat inside it stops
    recovery_window: 2m                     # 30s-30m: wait this long after an action before judging it
    action_timeout: 60s                     # 10s-5m: then the kernel kills the service's cgroup directly
    failed_mode: sms                        # tlg | sms | tlg-or-sms: reports when tgshd could not fix it

containers:
  interval: 5m
  threshold: 15m
  exclude: [ "runner-*" ]                   # glob on container name

http:
  - name: web-app                           # subject in messages; [a-z0-9-]+
    url: https://app.example.org/health
    interval: 10m
    threshold: 10m
    timeout: 15s                            # at most 20s, well inside the 40 s run budget
    status: [200, 399]
    connect_to: 192.0.2.5                   # optional: dial this address, keep URL host for TLS/Host
    # doh: https://dns.example.org/dns-query  # optional, mutually exclusive with connect_to
    follow_redirects: false                 # default false: a redirect is judged by its own status
    auth_refusal: down                      # down (default) | checker_error: what a 401/403 means
    # header is optional; placeholders are markers, and a value containing one
    # (case-insensitive) is a placeholder, reported as a checker error
    header: { name: Authorization, value_env: APP_TOKEN, prefix: "Bearer ", placeholders: [ "sample-key" ] }
    summary_group: web                      # optional: merged with other checks of this group
    depends_on: command/port-guard          # optional: skip while that condition is bad (a configured check, not itself, not disks or temperatures)
    needs_internet: false
    container: app                          # optional: also require this container healthy

freshness:
  - name: db-dump
    path: /var/lib/backup-status/db
    content: epoch                          # epoch (Unix seconds, a fraction is ignored) | mtime
    max_age: 26h
    future_tolerance: 1h                    # a stamp further in the future than this is stale
    summary_group: backups                  # optional: merged with other checks of this group
  - name: offsite-copy
    url: https://backup.example.org/last-success   # instead of path: exactly one of the two; needs content: epoch
    header: { name: X-Api-Key, value_env: BACKUP_STATUS_KEY }   # optional, url only
    timeout: 15s                            # url only; at most 20s
    max_age: 30h

command:
  - name: port-guard
    run: [ "/usr/local/bin/probe-port" ]    # argv, no shell
    interval: 5m
    timeout: 20s                            # at most 20s; the probe and its fix each get it
    timeout_verdict: broken                 # broken (default) | unreadable: what a timed-out probe means
    expect_output: "^ok"                    # optional regexp (Go RE2) the output must match
    forbid_output: "(?i)degraded|error"     # optional regexp the output must not match
    threshold: 0
    # pause_in_quiet_windows: true is the default; do not set it to false on a
    # command check with a fix unless the fix is safe during a quiet window.
    fix:                                    # optional
      after: 2                              # consecutive failures
      restart_container: worker             # or: run: [ "/usr/local/bin/fix" ]
      max_per_hour: 3
      grace_after_start: 2m
    report: journal                         # journal | alert (default alert)

# Requires BOT_GAMMU_DSN.
modem_probe:
  phone_env: MODEM_PHONE                    # env var holding the modem's own number
  weekday: sunday
  time: "11:02"
  reply_within: 30m
  max_silence: 8d                           # longer than a week plus reply_within
