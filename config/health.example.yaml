# Example host health configuration for tgshd (see README.md, "Host health
# monitoring"). Point BOT_HEALTH_CONFIG at a copy of this file to enable it.
#
# Strict YAML: unknown keys are errors. An invalid entry is reported as a
# checker error and skipped; a file that cannot be parsed disables health
# monitoring. All top-level sections are optional: an omitted section takes
# its defaults, and a check type that is absent is not run.
#
# Durations use Go syntax (30s, 15m, 6h) plus d for days (8d).
# Per-check common keys: interval, threshold, mode (tlg | sms | tlg-or-sms,
# default tlg), needs_internet (default false), summary_group (default none:
# one weekly-summary line per check; checks naming the same group, [a-z0-9-]+,
# share one line) and pause_in_quiet_windows (default false for disks,
# temperatures and kernel; true for every other check).

general:
  state_dir: /var/lib/tgshd                 # state database and instance lock
  heartbeat_file: /run/tgshd/heartbeat      # written every 30 s for an external watchdog
  maintenance_lock: /run/maintenance.lock   # optional; absent => no maintenance windows
  boot_grace: 10m
  concurrency: 4
  maintenance_max_hold: 6h                  # longest a maintenance window is honoured
  telegram_failing_after: 15m               # Telegram failures this long switch alerts to email/SMS

# Weekly report; omit the section to disable it.
summary:
  weekday: monday
  time: "09:00"                             # host local time

# Evaluated first every cycle.
network:
  interval: 5m
  threshold: 5m                             # default: one interval; 0 alerts on the first bad cycle
  internet_targets: [ "203.0.113.10", "198.51.100.20" ]   # any one answering => internet up
  mode: sms                                 # PROBLEM by SMS; RESOLVED by tlg-or-sms (fixed)

# Uses the BOT_NUT_* connection settings.
ups:
  interval: 5m
  threshold: 5m

disks:
  interval: 15m
  wear_percent: 80                          # NVMe percentage used / SSD wear above => PROBLEM
  selftest_max_age: 40d                     # calendar days since a passed self-test was observed; 8d is the closest to 001
  spare_floor_percent: 20                   # spare capacity floor, percent
  force_read_after: 24h
  include_serials: []                       # USB or other-transport drives to watch
  extra_counters: []                        # extra ATA attribute ids (1-255)
  extra_counters_by_serial: {}
  exclude_serials: []

temperatures:
  interval: 15m
  threshold: 0                              # the first reading at or above a limit opens a problem
  limits:                                   # degrees Celsius, PROBLEM at or above
    cpu: 90                                 # CPU package sensor
    drive_nvme: 60                          # judged by the disks check from SMART
    drive_sata: 60                          # SATA and SAS, judged by the disks check
    gpu: 85
    board: 75                               # default for board_sensors entries
  limits_by_serial: {}                      # drive serial -> limit (0-150), overrides the class limit
  board_sensors: []                         # board sensors to judge; chip required, label optional
  # board_sensors:                          # "*" globs work in chip and label
  #   - {chip: "nct*", label: "SYSTIN", limit: 75}   # limit defaults to limits.board

kernel:
  interval: 15m                             # EDAC counters; kmsg is read continuously

containers:
  interval: 5m
  threshold: 15m
  exclude: [ "runner-*" ]                   # glob on container name

http:
  - name: web-app                           # subject in messages; [a-z0-9-]+
    url: https://app.example.org/health
    interval: 10m
    threshold: 10m
    timeout: 15s                            # at most 20s, well inside the 40 s run budget
    status: [200, 399]
    connect_to: 192.0.2.5                   # optional: dial this address, keep URL host for TLS/Host
    # doh: https://dns.example.org/dns-query  # optional, mutually exclusive with connect_to
    follow_redirects: false                 # default false: a redirect is judged by its own status
    auth_refusal: down                      # down (default) | checker_error: what a 401/403 means
    header: { name: Authorization, value_env: APP_TOKEN, prefix: "Bearer ", placeholders: [ "sample-key" ] }   # optional; placeholders: values that mean the secret was never set
    depends_on: http/other-app              # optional: skip while that condition is bad
    needs_internet: false
    container: app                          # optional: also require this container healthy

freshness:
  - name: db-dump
    path: /var/lib/backup-status/db
    content: epoch                          # epoch (file holds a Unix time) | mtime
    max_age: 26h
    future_tolerance: 1h                    # a stamp further in the future than this is stale
    summary_group: backups                  # optional: merged with other checks of this group
  - name: offsite-copy
    url: https://backup.example.org/last-success   # instead of path: exactly one of the two; needs content: epoch
    header: { name: X-Api-Key, value_env: BACKUP_STATUS_KEY }   # optional, url only
    timeout: 15s                            # url only; at most 20s
    max_age: 30h

command:
  - name: port-guard
    run: [ "/usr/local/bin/probe-port" ]    # argv, no shell
    interval: 5m
    timeout: 20s                            # at most 20s; the probe and its fix each get it
    timeout_verdict: broken                 # broken (default) | unreadable: what a timed-out probe means
    # expect_output: "^ok"                  # optional regexp (Go RE2) the output must match
    # forbid_output: "(?i)degraded|error"   # optional regexp the output must not match
    threshold: 0
    fix:                                    # optional
      after: 2                              # consecutive failures
      restart_container: worker             # or: run: [ "/usr/local/bin/fix" ]
      max_per_hour: 3
      grace_after_start: 2m
    report: journal                         # journal | alert (default alert)

# Requires BOT_GAMMU_DSN.
modem_probe:
  phone_env: MODEM_PHONE                    # env var holding the modem's own number
  weekday: sunday
  time: "11:02"
  reply_within: 30m
  max_silence: 8d
