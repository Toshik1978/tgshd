run:
  concurrency: 4
  timeout: 2m
  go: "1.23"

linters-settings:
  funlen:
    lines: 60
    statements: 40

  govet:
    enable-all: true
    disable:
    - fieldalignment

  revive:
    confidence: 0.8
    rules:
      - name: unexported-return
        disabled: true

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/Toshik1978

  gocyclo:
    min-complexity: 10

  dupl:
    threshold: 100

  lll:
    line-length: 120

  nakedret:
    max-func-lines: 30

  prealloc:
    simple: true
    range-loops: true # Report preallocation suggestions on range loops, true by default
    for-loops: false # Report preallocation suggestions on for loops, false by default

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated
    disabled-checks:
      - hugeParam
      - whyNoLint
      - unnamedResult

  depguard:
    rules:
      main:
        allow:
          - $gostd
          - github.com

linters:
  disable-all: true
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gofmt
    - goimports
    - revive
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - copyloopvar
    - staticcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - whitespace

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unused
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - lll
        - funlen
    - linters:
        - lll
      source: "^//go:generate "
