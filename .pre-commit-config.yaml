# Install with `pre-commit install`. That alone only wires the pre-commit
# stage, which would leave the pre-push hooks dormant — declaring the hook
# types here is what makes one command enough.
#
# No commit-msg hook: this repository uses plain imperative subjects, not
# conventional-commit prefixes (see .claude/CLAUDE.md).
default_install_hook_types: [pre-commit, pre-push]

repos:
- repo: local
  hooks:
    # Each gate at the cheapest stage that still catches it. Cheap enough for
    # every commit; a nuisance to discover later.
    - id: golangci-lint-fmt
      name: golangci-lint fmt --diff
      entry: golangci-lint fmt --diff
      language: system
      types: [go]
      pass_filenames: false
      stages:
        - pre-commit

    # Pre-push, not earlier: these are the full CI gates, and pushing is the
    # first point at which anyone else sees the commits. Putting them on
    # pre-commit is the surest way to breed the `--no-verify` habit that makes
    # the hooks worthless.
    #
    # Not filtered by file type: a push touching only go.mod, go.sum or
    # .golangci.yml can break the build just as well, and `types: [go]` would
    # skip exactly those.
    - id: lint
      name: task lint
      entry: task lint
      language: system
      pass_filenames: false
      stages:
        - pre-push

    - id: tests
      name: task test
      entry: task test
      language: system
      pass_filenames: false
      stages:
        - pre-push

    # Secrets in the staged diff, before they reach history: a pushed secret
    # has to be rotated, not just removed. False positives go in .gitleaks.toml.
    - id: gitleaks
      name: gitleaks (staged)
      entry: gitleaks git --pre-commit --staged --redact --verbose
      language: system
      pass_filenames: false
      always_run: true
      stages:
        - pre-commit

# Stock file guards: oversized files, leftover conflict markers, YAML that
# does not parse. Not the whitespace fixers: they rewrite patches, fixtures
# and generated files (piloted on linux-config, 2026-11-18).
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      stages: [pre-commit]
    - id: check-merge-conflict
      stages: [pre-commit]
    - id: check-yaml
      stages: [pre-commit]

- repo: local
  hooks:
    - id: actionlint
      name: actionlint
      entry: actionlint
      language: system
      files: ^\.github/workflows/.*\.ya?ml$
      stages: [pre-commit]

    # hadolint comes from mise (dotfiles scripts/mise.sh; linux-config
    # bootstrap/mise/config.toml on the server).
    - id: hadolint
      name: hadolint
      entry: hadolint
      language: system
      types: [dockerfile]
      stages: [pre-commit]
