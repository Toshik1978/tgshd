general:
  state_dir: /var/lib/tgshd
  heartbeat_file: /run/tgshd/heartbeat
  maintenance_lock: /run/maintenance.lock
  boot_grace: 10m
  concurrency: 4
summary:
  weekday: monday
  time: "09:00"
network:
  interval: 5m
  threshold: 0
  internet_targets: ["203.0.113.10", "198.51.100.20"]
  mode: sms
ups:
  interval: 5m
  threshold: 5m
disks:
  interval: 15m
  wear_percent: 80
  selftest_max_age: 8d
  exclude_serials: [TEST0000000001]
temperatures:
  interval: 15m
  threshold: 15m
  limits:
    cpu: 85
    drive_nvme: 70
    drive_sata: 55
    gpu: 85
    board: 75
kernel:
  interval: 15m
containers:
  interval: 5m
  threshold: 15m
  exclude: ["runner-*"]
http:
  - name: web-app
    url: https://app.example.org/health
    interval: 10m
    threshold: 10m
    timeout: 15s
    status: [200, 399]
    connect_to: 192.0.2.5
    header: { name: Authorization, value_env: APP_TOKEN, prefix: "Bearer " }
    depends_on: http/other-app
    container: app
  - name: other-app
    url: https://other.example.org/
    doh: https://dns.example.org/dns-query
freshness:
  - name: db-dump
    path: /var/lib/backup-status/db
    content: epoch
    max_age: 26h
command:
  - name: port-guard
    run: ["/usr/local/bin/probe-port"]
    interval: 5m
    timeout: 60s
    threshold: 0
    fix:
      after: 2
      restart_container: worker
      max_per_hour: 3
      grace_after_start: 2m
    report: journal
modem_probe:
  phone_env: MODEM_PHONE
  weekday: sunday
  time: "11:02"
  reply_within: 30m
  max_silence: 8d
